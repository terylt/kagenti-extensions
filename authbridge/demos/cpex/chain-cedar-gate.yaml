# CPEX demo: Cedar PDP gate.
#
# Scenario: gating MCP tool calls with Cedar policies that relate the
# principal's role to the resource attributes. Engineers can read
# internal repos; nobody else can.
#
# Flow:
#   1. jwt-validation     — gates by Keycloak-signed JWT
#   2. mcp-parser         — populates pctx.Extensions.MCP from the body
#   3. cpex               — runs Cedar PDP on tool-call args
#
# CPEX side:
#   - apl.identity.jwt picks up `iss` / claims from the validated JWT
#   - apl.pdp.cedar permits engineers→internal, denies the rest

mode: proxy-sidecar

spiffe: {}        # optional; only needed if mTLS is enabled below

session:
  enabled: true
  ttl: 30m

listener:
  reverse_proxy_addr: ":8080"
  forward_proxy_addr: ":8081"
  reverse_proxy_backend: "http://hr-mcp:9100"
  session_api_addr: "127.0.0.1:9094"

stats:
  stats_address: "127.0.0.1:9093"

pipeline:
  inbound:
    plugins:
      - name: jwt-validation
        config:
          issuer: "http://localhost:8081/realms/cpex-demo"
          keycloak_url: "http://keycloak:8080"
          keycloak_realm: "cpex-demo"
          audience: "hr-copilot"
          bypass_paths:
            - "/healthz"
            - "/readyz"
            - "/.well-known/*"

      - name: mcp-parser

      - name: cpex
        config:
          hooks:
            on_request:
              - cmf.tool_pre_invoke

          apl:
            identity:
              jwt:
                issuer: "http://localhost:8081/realms/cpex-demo"
                jwks_url: "http://keycloak:8080/realms/cpex-demo/protocol/openid-connect/certs"

            pdp:
              cedar:
                policies: |
                  // Engineers can read internal repos. The relationship
                  // (principal's role × resource's visibility) is the
                  // archetypal Cedar shape.
                  @id("engineering-internal-repos")
                  permit(
                    principal,
                    action == Action::"read",
                    resource is Repo
                  ) when {
                    principal.roles.contains("engineer") &&
                    resource.visibility == "internal"
                  };

                  // Security team can read any repo regardless of
                  // visibility — escape hatch for incident response.
                  @id("security-team-any-repo")
                  permit(
                    principal,
                    action == Action::"read",
                    resource is Repo
                  ) when {
                    principal.roles.contains("security")
                  };

          pipelines:
            cmf.tool_pre_invoke:
              # The pdp/cedar-direct factory binds Cedar to CPEX's
              # CMF dispatcher; it reads principal.roles from the
              # JWT identity that apl.identity.jwt resolved, and
              # resource attributes from the MCP tool's args.
              - pdp/cedar-direct
  outbound:
    plugins: []
